const SKILL_GROUP_META = [{"id":"project-owned","title":"工程 Skill","description":"本工程 canonical Skill 原子，提供面向 Agent 的可发现任务能力。"},{"id":"seshat-governance","title":"Seshat 信息治理 Skills","description":"用于工程信息资产的审计、Authority 追踪、标准化、证据留存和治理就绪检查。"}];
const escapeAttr = value => String(value||'')
  .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const SKILL_CLASS_LABELS = {
  public: '对外提供能力',
  inner: '本工程自用能力',
  private: 'public 依赖的私有实现',
  outside: '外部提供能力',
};
const SKILL_CLASS_ORDER = ['public','inner','private','outside'];

function skillEvidenceMarkup(values){
  const items=Array.isArray(values)?values.filter(Boolean):[];
  return items.length
    ? `<div class="skill-evidence-list">${items.map(value=>`<code>${escapeAttr(value)}</code>`).join('')}</div>`
    : '<span class="skill-evidence-empty">—</span>';
}

function skillClassSummaryMarkup(){
  return `<section class="skill-class-summary">${SKILL_CLASS_ORDER.map(skillClass=>{
    const count=SKILL_INVENTORY.filter(skill=>skill.skillClass===skillClass).length;
    return `<article data-skill-class-summary="${skillClass}"><b>${count}</b><strong>${skillClass}</strong><span>${SKILL_CLASS_LABELS[skillClass]}</span></article>`;
  }).join('')}</section>`;
}

function skillTableRowMarkup(skill){
  return `<tr>
    <td class="skill-name">${escapeAttr(skill.displayName||skill.skillId)}</td>
    <td><code class="skill-id">$${escapeAttr(skill.skillId)}</code></td>
    <td class="skill-purpose">${escapeAttr(skill.shortDescription||skill.description||'—')}</td>
    <td class="skill-example">${escapeAttr(skill.defaultPrompt||`使用 $${skill.skillId}`)}</td>
    <td><span class="skill-class" title="skillClass=${escapeAttr(skill.skillClass||'未声明')}">${escapeAttr(skill.skillClassLabel||SKILL_CLASS_LABELS[skill.skillClass]||'未声明')}</span></td>
    <td>${skillEvidenceMarkup([skill.codexCompatibility,skill.seshatGovernance])}</td>
    <td>${skillEvidenceMarkup([skill.forwardEvaluation,skill.gatingLabel])}</td>
    <td>${skillEvidenceMarkup(skill.capabilities)}</td>
    <td>${skillEvidenceMarkup(skill.usedBySurfaces)}</td>
  </tr>`;
}

function renderSkillInventory(){
  const groups=SKILL_GROUP_META.map(function(group){
    const items=SKILL_INVENTORY.filter(function(skill){return skill.group===group.id;});
    if(!items.length)return '';
    return `<section class="skills-group" data-skill-group="${group.id}"><div class="skills-group-head"><div><h3>${group.title}</h3><p>${group.description}</p></div><span class="skills-group-count">${items.length} 个</span></div><div class="skills-table-wrap"><table class="skills-table"><thead><tr><th>中文名</th><th>Skill 名</th><th>作用</th><th>使用例子</th><th>skillClass（中文）</th><th>对齐/治理</th><th>forward/gating</th><th>能力 ID</th><th>被谁使用</th></tr></thead><tbody>${items.map(skillTableRowMarkup).join('')}</tbody></table></div></section>`;
  }).join('');
  document.getElementById('content').innerHTML=`<div class="skills-page">
    <section class="skills-hero"><h2>🧩 ${escapeAttr(PROJECT_TITLE)} · Skills 清单</h2><p>根据要解决的问题选择 Skill，再使用 <code>$skill-id</code> 触发。<code>skillClass</code> 是相对本工程的唯一分类：<strong>public=对外提供能力</strong>、<strong>inner=本工程自用能力</strong>、<strong>private=public 依赖的私有实现</strong>、<strong>outside=外部提供能力</strong>。Codex 静态对齐、Seshat 治理、forward evidence 和 gating 分开展示；最终结论以实时 <code>skills lint</code>、<code>skills review</code> 和 <code>verify</code> 为准。</p></section>
    ${skillClassSummaryMarkup()}
    <div class="skills-groups">${groups||'<div class="empty-state"><div class="icon">⚠️</div><p>未发现 canonical Skill，请重新运行 <code>seshat standardize</code>。</p></div>'}</div>
  </div>`;
}

document.addEventListener('DOMContentLoaded', renderSkillInventory);
</script>
